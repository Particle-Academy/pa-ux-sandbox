name: Dogfood

# The showcase is part of the kit's end-to-end suite. A suite running versions
# nobody ships is green about code consumers never receive — which is worse
# than no suite, because it reads as coverage.
#
# This runs on a SCHEDULE rather than on push, deliberately. A package shipping
# at 3pm should not retroactively redden an unrelated pull request; it should
# raise its own signal. Blocking every push on it is how a check gets muted.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    name: Running the latest of everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Third-party dependency allowlist. This job INSTALLS -- composer install
      # and npm ci below -- so it needs the same gate ci.yml carries, and it did
      # not have it. Found 2026-09-21 by the org gate audit, once that audit
      # started asking what a workflow DOES rather than what it is named:
      # matching on filename, it only ever looked at publish/ci/test/third-party
      # and this file was invisible to it.
      #
      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left lying in the workspace is not
          # inert -- vitest globbed the checker's own tests out of it and failed
          # a package whose code was fine.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, sqlite3, pdo_sqlite
        env:
          update: true # latest patch, not the runner's preinstalled one
      - name: Floor PHP at the PHP2Shell-patched release (CVE-2026-109618/109619)
        run: php -r '$v=$argv[1]??PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION.".".PHP_RELEASE_VERSION; $f=["8.5"=>"8.5.12","8.4"=>"8.4.27","8.3"=>"8.3.36","8.2"=>"8.2.35"][implode(".",array_slice(explode(".",$v),0,2))]??(version_compare($v,"8.6",">=")?"8.6":"8.2.35"); if(version_compare($v,$f,"<")){echo "::error::PHP $v is below the PHP2Shell floor $f".PHP_EOL;exit(1);} echo "PHP $v >= PHP2Shell floor $f".PHP_EOL;'

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Both installs: the check reads what is ACTUALLY installed, not what the
      # constraints intended — they disagree exactly when this matters.
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --no-audit --no-fund

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check
        run: php artisan kit:dogfood

      # Does the LIVE endpoint serve every tool this server declares?
      #
      # `search-backend-packages` was committed 2026-08-22, merged, deployed,
      # and never served -- a month later the public tools/list returned 15
      # against the 18 declared. Nothing caught it because nothing compared the
      # two, and every signal anyone would think to check said "deployed": the
      # site was current and the MCP's own DATA was current.
      #
      # Here rather than in `php artisan test` on purpose. It asks PRODUCTION a
      # question, so it belongs with the other checks that measure what
      # consumers actually receive -- and on a schedule, where a deploy that
      # goes stale at 3pm raises its own signal instead of reddening an
      # unrelated pull request.
      - name: Every declared MCP tool is actually served
        run: php artisan mcp:served

      # Does every package version the connector catalogue CLAIMS still resolve?
      #
      # `connectors:check` was written for exactly this and was then wired into
      # nothing -- it ran only when a person typed it, which over 26 connectors
      # and 104 packages across npm, Packagist and PyPI means it effectively did
      # not run. Its own docblock says staleness "has to be a red build rather
      # than something someone remembers", and it was the second thing.
      #
      # The failure it catches is silent by construction: the catalogue is
      # GENERATED in another workspace and pushed here, so a version moves,
      # nobody re-sends the file, and a stale catalogue parses exactly like a
      # fresh one. Nothing goes red. `kit:dogfood` does not cover it -- that
      # checks what the SHOWCASE installs, and no connector is a dependency of
      # this app.
      #
      # Here and not in ci.yml deliberately: it asks three public registries a
      # question, so putting it on every pull request would make unrelated work
      # depend on their availability. Nightly is where a check that can fail for
      # someone else's reasons belongs. A failed lookup FAILS the check rather
      # than counting as current -- a network blip that reads as "published" is
      # worse than no check, because it is a check people trust.
      - name: Every connector package version still resolves
        run: php artisan connectors:check

      # resources/flow-nodes/_connector is GENERATED from the latest
      # fancy-connector-core release by that package's scripts/vendor.mjs. The
      # sandbox test only checks each file carries a GENERATED banner; its
      # comment said the regenerate-and-diff check lived in the package's CI,
      # and no CI anywhere ran it. The copy sat two releases stale (0.4 source
      # under 0.6.1) with every check green. This is that check, against the
      # newest release tag, since the showcase must run the latest of everything.
      - name: Latest fancy-connector-core release
        id: connector_core
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/Particle-Academy/fancy-connector-core.git 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out fancy-connector-core ${{ steps.connector_core.outputs.tag }}
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-connector-core
          ref: ${{ steps.connector_core.outputs.tag }}
          path: .fancy-connector-core
          persist-credentials: false

      - name: Vendored connector runtime matches that release
        run: |
          node .fancy-connector-core/scripts/vendor.mjs --target resources/flow-nodes/_connector --check
          node -e "require('node:fs').rmSync('.fancy-connector-core',{recursive:true,force:true})"
