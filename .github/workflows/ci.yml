name: CI

# Why this exists, and why it leads with the type-check.
#
# This app had no CI. 844 tests, a client and an SSR bundle, and nothing ran any
# of it on push — the Laravel apps were deliberately left out when the suite's
# packages got their canonical workflows, and the gap was never revisited.
#
# The type-check is first because of what it caught when someone finally read
# it: **245 errors had accumulated**, and inside them were 57 icons rendering at
# the wrong size, 35 headings rendering as the wrong element, a pagination
# control stuck on page 1, blank avatars, a docs page demonstrating a prop that
# does not exist, and a dashboard click handler that was never installed. Every
# one was reported. Nobody read the output, which is the rational response to
# 245 lines of noise.
#
# That is the failure mode this job prevents. Not the first error — the
# hundredth, after the signal has already been abandoned. Keeping the count at
# zero is what keeps it readable.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Third-party dependency allowlist. Cheap, and failing here is cheap --
      # the same check gates the release, so a PR that adds an unapproved or
      # abandoned dependency finds out now rather than at tag time.
      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left lying in the workspace is not
          # inert: vitest globbed the checker's own tests out of it and failed
          # a package whose code was fine. Removed with node, not rm -rf,
          # because some of these matrices run on windows-latest where a
          # multi-line run: block is PowerShell and rm -rf is not a command.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      # resources/flow-nodes/_connector is GENERATED from the latest
      # fancy-connector-core release by that package's scripts/vendor.mjs. The
      # sandbox test only checks each file carries a GENERATED banner; its
      # comment said the regenerate-and-diff check lived in the package's CI,
      # and no CI anywhere ran it. The copy sat two releases stale (0.4 source
      # under 0.6.1) with every check green. This is that check, against the
      # newest release tag, since the showcase must run the latest of everything.
      - name: Latest fancy-connector-core release
        id: connector_core
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/Particle-Academy/fancy-connector-core.git 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out fancy-connector-core ${{ steps.connector_core.outputs.tag }}
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-connector-core
          ref: ${{ steps.connector_core.outputs.tag }}
          path: .fancy-connector-core
          persist-credentials: false

      - name: Vendored connector runtime matches that release
        run: |
          node .fancy-connector-core/scripts/vendor.mjs --target resources/flow-nodes/_connector --check
          node -e "require('node:fs').rmSync('.fancy-connector-core',{recursive:true,force:true})"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # `npm ci` rather than `install`: the lockfile is what a deploy resolves,
      # so it is what CI should verify.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      # The vitest suite (tests/js: the TUI model and renderer, the flow studio
      # effects, and the rest) ran nowhere. PHP tests cannot see React, so
      # these are the only checks on that code, and CI never executed them.
      - name: JS tests
        run: npm test

      # Both bundles. The SSR build fails on browser-only imports that the
      # client build accepts, and Inertia renders SSR synchronously — a page
      # that throws there degrades to client-side rendering silently.
      #
      # MEASURED, against a budget. Forge runs this same build ON the production
      # box, so a memory regression here does not fail a test — it OOM-kills the
      # deploy, and because Forge prunes only SUCCESSFUL deploys the dead release
      # is also left on disk forever. Nothing else in CI has an opinion about
      # RAM, so this class used to reach production and announce itself as an
      # outage.
      #
      # The budget sits between MEASURED points, not a guess:
      #   barrel import of @babylonjs/core  1571 MB (local)  -> OOM-killed the deploy
      #   the same build, granular imports  1197 MB (local)  -> deploys in 90s
      #   this runner, healthy build        1352 MB (CI)     -> the real baseline
      #
      # The first budget was 1400 MB, from the local figures. THIS RUNNER measured
      # 1352 MB on the first green run — 48 MB of headroom, 3.4%. That is a check
      # that goes red on variance, and one that cries wolf gets ignored, which is
      # worse than not having it. Linux CI runs ~13% heavier than the machine the
      # local numbers came from.
      #
      # 1550 MB gives the healthy build ~200 MB (15%) of headroom and still sits
      # well under the barrel shape, which scaled onto this runner would be
      # ~1775 MB. Move this ONE number if the baseline genuinely shifts, and say
      # why — do not delete the check, and do not raise it to accommodate a
      # regression rather than fixing the regression.
      #
      # Peak RSS scales with the whole module graph, not with any one chunk, so
      # BUILD_MASS=1 prints the per-package tally next to it: a failure names the
      # package that grew instead of only going red.
      - name: Build (peak memory is budgeted)
        env:
          BUILD_MASS: "1"
          BUILD_PEAK_BUDGET_MB: "1550"
        run: |
          set -o pipefail
          /usr/bin/time -v -o build-mem.txt npm run build 2>&1 | tee build-log.txt

          peak_kb=$(awk '/Maximum resident set size/ {print $NF}' build-mem.txt)
          if [ -z "$peak_kb" ]; then
            echo "::warning::could not read peak RSS from /usr/bin/time; budget not enforced"
            exit 0
          fi
          peak_mb=$(( peak_kb / 1024 ))

          echo "### Build peak memory: ${peak_mb} MB (budget ${BUILD_PEAK_BUDGET_MB} MB)" >> "$GITHUB_STEP_SUMMARY"
          grep '^BUILD-MASS' build-log.txt | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

          if [ "$peak_mb" -gt "$BUILD_PEAK_BUDGET_MB" ]; then
            echo "::error::Build peak memory ${peak_mb} MB exceeds the ${BUILD_PEAK_BUDGET_MB} MB budget."
            echo
            echo "This is the shape that OOM-kills the Forge deploy. The module graph below"
            echo "is sorted by source bytes transformed — the top entry that moved is the cause."
            echo "A barrel import costs this memory even when the emitted chunk stays small;"
            echo "importing each symbol from its own module is usually the whole fix."
            echo
            grep '^BUILD-MASS' build-log.txt || true
            exit 1
          fi

          echo "Build peak memory ${peak_mb} MB is within the ${BUILD_PEAK_BUDGET_MB} MB budget."

      # The tests need these. Almost every feature test renders a Blade view
      # that calls `@vite`, which throws ViteManifestNotFoundException without
      # `public/build/manifest.json` — 230 of 855 failed on the first run of
      # this workflow for exactly that reason, all of them green locally where
      # a previous build had left the manifest lying around.
      #
      # Passing the real build across rather than rebuilding it: one build, and
      # the tests run against the assets that were actually just verified.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: public/build
          retention-days: 1

  backend:
    name: Tests
    runs-on: ubuntu-latest
    # Only for the manifest. The trade is a serialized pipeline; the
    # alternative is a second npm install + build in this job, which costs more
    # wall-clock than the wait.
    needs: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: public/build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, sqlite3, pdo_sqlite
        env:
          update: true # latest patch, not the runner's preinstalled one
      - name: Floor PHP at the PHP2Shell-patched release (CVE-2026-109618/109619)
        run: php -r '$v=$argv[1]??PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION.".".PHP_RELEASE_VERSION; $f=["8.5"=>"8.5.12","8.4"=>"8.4.27","8.3"=>"8.3.36","8.2"=>"8.2.35"][implode(".",array_slice(explode(".",$v),0,2))]??(version_compare($v,"8.6",">=")?"8.6":"8.2.35"); if(version_compare($v,$f,"<")){echo "::error::PHP $v is below the PHP2Shell floor $f".PHP_EOL;exit(1);} echo "PHP $v >= PHP2Shell floor $f".PHP_EOL;'

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Not only PHP dependencies. `ReactFancyComponentListTest` reads the
      # installed `@particle-academy/react-fancy` to check that
      # `PackageRegistry` still mirrors what the package actually exports —
      # and it deliberately FAILS rather than skips when the package is
      # absent, because a green tick over an unrun check is worse than a red
      # one. It was right to; without this the check silently did not run.
      #
      # A second install rather than passing node_modules from the other job:
      # the artifact would be hundreds of megabytes to upload and download,
      # which costs more than installing it again.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Tests run against in-memory sqlite (see phpunit.xml), so there is no
      # service container to wait on.
      #
      # `--exclude-group=envelope` skips the checks whose inputs live ABOVE this
      # repo — the envelope's `.gitmodules` and every sibling submodule's
      # manifest on disk. A single-repo checkout cannot see them, and no amount
      # of fetching fixes it: the envelope is PRIVATE, this app is PUBLIC and
      # holds no secrets, so the default GITHUB_TOKEN cannot read it; and even
      # with the file, the checks stat sibling working trees that are not here.
      #
      # This is a relocation, not a suppression. Those checks run from the
      # envelope, where their inputs exist — Particle-Academy/fancy.agi,
      # `.github/workflows/submodule-registry.yml` — and they still run by
      # default for anyone working inside the envelope locally.
      #
      # Do not remove this flag to "fix" a red build. It was added because the
      # group failed on every push for six days (~33 runs) and was read as
      # noise, which is the more expensive failure: a job nobody trusts stops
      # reporting the 1010 tests that DO run here.
      - name: Run tests
        run: php artisan test --compact --exclude-group=envelope
