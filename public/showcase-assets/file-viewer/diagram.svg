<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="FileViewer architecture diagram">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- transparent background so the checkerboard shows through -->
  <rect x="40" y="120" width="180" height="120" rx="14" fill="url(#g)"/>
  <rect x="380" y="60" width="180" height="100" rx="14" fill="#f59e0b"/>
  <rect x="380" y="200" width="180" height="100" rx="14" fill="#ec4899"/>
  <path d="M220 180 H300 V110 H380" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <path d="M220 180 H300 V250 H380" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <text x="130" y="185" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff">FileViewer</text>
  <text x="470" y="115" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#ffffff">CodeEditor</text>
  <text x="470" y="255" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#ffffff">MediaViewer</text>
</svg>
